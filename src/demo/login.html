<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 管理后台</title>
<link rel="stylesheet" href="/ui.css" />
</head>
<body>
<main class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <svg class="admin-brand-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="emrBrandGradLogin" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop class="brand-stop-a" offset="0" />
            <stop class="brand-stop-b" offset="1" />
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#emrBrandGradLogin)" />
        <rect class="brand-mark" x="6.3" y="9" width="3.1" height="14" rx="1.55" />
        <rect class="brand-mark" x="6.3" y="19.9" width="8.4" height="3.1" rx="1.55" />
        <rect class="brand-mark" x="16.3" y="9" width="9.4" height="14" rx="4.7" />
        <rect x="19.4" y="12" width="3.2" height="8" rx="1.6" fill="url(#emrBrandGradLogin)" />
      </svg>
      <h1 class="admin-title">管理后台</h1>
    </div>

    <!--FORM:LOGIN-->
    <form id="loginForm" class="login-form" autocomplete="on">
      <label class="cfg-admin">账号
        <input id="loginUsername" required placeholder="数据库里的账号名，如 admin" autocomplete="username" />
      </label>
      <label class="cfg-admin">口令
        <input id="loginPassword" type="password" required placeholder="必填" autocomplete="current-password" />
      </label>
      <button class="primary" id="loginBtn" type="submit">登录</button>
    </form>
    <!--/FORM:LOGIN-->

    <!--FORM:BOOTSTRAP-->
    <form id="bootstrapForm" class="login-form" autocomplete="off">
      <div class="muted login-lead">这台机器还没有任何账号。创建第一个管理员，
        账号会写入数据库，此后本页只显示登录表单。</div>
      <label class="cfg-admin">账号
        <input id="bootUsername" required placeholder="字母、数字与 . _ @ -，2~32 位，如 admin" autocomplete="off" />
      </label>
      <label class="cfg-admin">口令
        <input id="bootPassword" type="password" required placeholder="至少 8 位" autocomplete="new-password" />
      </label>
      <label class="cfg-admin">再输一次
        <input id="bootPassword2" type="password" required placeholder="两遍必须一致" autocomplete="new-password" />
      </label>
      <!--BOOTSTRAP_DEPLOY-->
      <button class="primary" id="bootBtn" type="submit">创建管理员</button>
    </form>
    <!--/FORM:BOOTSTRAP-->

    <div id="loginStatus" class="muted cfg-status" aria-live="polite"></div>

    <div class="login-note-box"><!--ADMIN_TOKEN_NOTE--></div>
  </div>
</main>
<script src="/login.js"></script>
</body>
</html>
